spring.application.name=test-platform

# ---- PostgreSQL ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:testplatform}${DB_SSL_OPTION:}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:mirrorfit}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:change-me}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- Server ----
server.port=${PORT:8080}

# ---- Admin credentials (change these) ----
admin.username=admin
admin.password=admin123

# ---- File upload ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
