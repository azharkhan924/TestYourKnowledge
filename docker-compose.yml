services:
  postgres-db:
    image: postgres:15-alpine
    container_name: testplatform-postgres
    restart: always
    environment:
      POSTGRES_DB: testplatform
      POSTGRES_USER: testplatform_user
      POSTGRES_PASSWORD: testplatform_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: testplatform-backend
    restart: always
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=testplatform
      - DB_USER=testplatform_user
      - DB_PASSWORD=testplatform_secure_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - postgres-db

  caddy:
    image: caddy:2-alpine
    container_name: testplatform-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DUCKDNS_DOMAIN=your-subdomain.duckdns.org  # Change this to your actual DuckDNS domain!
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web-app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
