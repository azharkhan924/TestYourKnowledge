<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Portal Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .step-otp {
    transition: all 0.3s ease;
  }
  .login-container {
    padding-top: 96px;
  }
  @media (max-width: 480px) {
    .login-container {
      padding-top: 32px;
    }
  }
</style>
</head>
<body>
<div class="container login-container" style="max-width:420px;">
  <div class="ticket">
    <div class="ticket-header" style="justify-content:center;">
      <div class="center-text" style="width:100%;">
        <div class="seal" style="margin:0 auto 12px;">T</div>
        <div class="ticket-eyebrow">Teacher Access</div>
        <h1 style="font-size:22px;">Portal Sign In</h1>
      </div>
    </div>
    <div class="ticket-body">
      <div id="login-error" class="alert alert-error hidden"></div>
      <div id="login-success" class="alert alert-success hidden"></div>
      
      <!-- STEP 1: Enter Email -->
      <div id="email-section">
        <div class="field">
          <label for="email">Teacher Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" style="width: 100%; padding: 12px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius); font-size: 15px;">
          <div class="field-hint">We'll send a 6-digit OTP verification code.</div>
        </div>
        <button class="btn btn-primary btn-block" id="send-otp-btn">Send OTP</button>
      </div>

      <!-- STEP 2: Enter OTP (Hidden Initially) -->
      <div id="otp-section" class="hidden step-otp">
        <div class="field">
          <label for="otp">Enter 6-Digit OTP</label>
          <input type="text" id="otp" placeholder="123456" inputmode="numeric" maxlength="6" style="width: 100%; padding: 12px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius); font-size: 15px; letter-spacing: 0.15em; text-align: center; font-family: var(--font-mono); font-weight: 700;">
          <div class="field-hint">Check your email inbox (and spam folder) for the verification code.</div>
        </div>
        <button class="btn btn-success btn-block" id="login-btn">Verify &amp; Sign In</button>
        <button class="btn btn-outline btn-block mt-8" id="back-btn" style="font-size: 13px; padding: 10px;">Back to Email</button>
      </div>

      <div style="text-align: center; margin-top: 20px;">
        <a href="index.html" style="font-size: 13px; color: var(--muted); text-decoration: none; font-weight: 500; transition: color 0.15s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'">Back to Home</a>
      </div>
    </div>
  </div>
</div>
<div style="text-align: center; padding: 24px 20px; font-size: 11px; color: var(--muted); font-family: var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase;">
  Platform Developed by Azhar Khan
</div>
<script src="js/api.js"></script>
<script>
const errEl = document.getElementById('login-error');
const succEl = document.getElementById('login-success');
const emailSec = document.getElementById('email-section');
const otpSec = document.getElementById('otp-section');
const emailInput = document.getElementById('email');
const otpInput = document.getElementById('otp');

function showError(msg) {
  errEl.textContent = msg;
  errEl.classList.remove('hidden');
  succEl.classList.add('hidden');
}

function showSuccess(msg) {
  succEl.textContent = msg;
  succEl.classList.remove('hidden');
  errEl.classList.add('hidden');
}

function clearAlerts() {
  errEl.classList.add('hidden');
  succEl.classList.add('hidden');
}

// Send OTP
document.getElementById('send-otp-btn').addEventListener('click', async () => {
  clearAlerts();
  const email = emailInput.value.trim();
  if (!email || !email.includes('@')) {
    showError('Please enter a valid email address.');
    return;
  }
  const btn = document.getElementById('send-otp-btn');
  btn.disabled = true;
  btn.textContent = 'Sending OTP…';

  try {
    await apiRequest('/admin/request-otp', { method: 'POST', body: { email } });
    showSuccess('OTP code has been sent. Please verify below!');
    emailSec.classList.add('hidden');
    otpSec.classList.remove('hidden');
    otpInput.focus();
  } catch (e) {
    showError(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send OTP';
  }
});

// Verify & Login
document.getElementById('login-btn').addEventListener('click', async () => {
  clearAlerts();
  const email = emailInput.value.trim();
  const otp = otpInput.value.trim();
  if (!otp || otp.length !== 6) {
    showError('Please enter the 6-digit OTP code.');
    return;
  }
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = 'Verifying…';

  try {
    const res = await apiRequest('/admin/login', { method: 'POST', body: { email, otp } });
    localStorage.setItem('adminToken', res.token);
    window.location.href = 'admin.html';
  } catch (e) {
    showError(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Verify & Sign In';
  }
});

// Back to Email
document.getElementById('back-btn').addEventListener('click', () => {
  clearAlerts();
  emailSec.classList.remove('hidden');
  otpSec.classList.add('hidden');
  otpInput.value = '';
});

otpInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('login-btn').click();
});
emailInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('send-otp-btn').click();
});
</script>
</body>
</html>
