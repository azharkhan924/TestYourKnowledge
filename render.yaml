databases:
  - name: testplatform-db
    databaseName: testplatform
    user: testplatform_user

services:
  - type: web
    name: testplatform-service
    env: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/*.jar
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: testplatform-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: testplatform-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: testplatform-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
